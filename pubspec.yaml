name: cdax_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.5
  image_picker: ^1.0.4
  path_provider: ^2.1.3
  flutter_downloader: ^1.11.6
  permission_handler: ^11.3.1
  video_player: ^2.8.1
  chewie: ^1.7.1
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  razorpay_flutter: ^1.3.7
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.0
  http: ^1.1.0
  intl: ^0.20.2
  youtube_player_flutter: ^9.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0


flutter_icons:
  android: true
  ios: true
  image_path: assets/icon/logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/gifs/
    - assets/icon/
